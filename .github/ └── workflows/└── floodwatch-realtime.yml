name: FloodWatch Realtime

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  realtime:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger FloodWatch realtime coordinator
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body \
            --silent \
            --show-error \
            --max-time 60 \
            -H "X-Cron-Secret: ${CRON_SECRET}" \
            "https://floodwatch.freedev.app/cron/realtime_coordinator.php?action=run"
