name: FloodWatch Worker Test

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Test scheduled execution
        run: |
          echo "================================"
          echo "FloodWatch Worker Test"
          echo "================================"
          echo "Executed at:"
          date -u
          echo
          echo "UTC timestamp:"
          date -u +"%Y-%m-%dT%H:%M:%SZ"
          echo
          echo "Worker execution successful."
