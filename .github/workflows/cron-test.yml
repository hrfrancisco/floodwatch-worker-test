name: FloodWatch Weather Worker Test

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  weather-test:
    runs-on: ubuntu-latest

    steps:
      - name: Test OpenWeather
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
        run: |
          echo "================================"
          echo "FloodWatch OpenWeather Test"
          echo "================================"

          RESPONSE=$(curl -sS \
            "https://api.openweathermap.org/data/2.5/weather?lat=14.3058&lon=121.0546&appid=${OPENWEATHER_API_KEY}&units=metric")

          echo "OpenWeather response:"
          echo "$RESPONSE"

          echo
          echo "OpenWeather request completed."
