name: FloodWatch Weather Worker Test

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  weather-test:
    runs-on: ubuntu-latest

    steps:
      - name: Test Open-Meteo
        run: |
          echo "================================"
          echo "FloodWatch Weather Worker Test"
          echo "================================"

          RESPONSE=$(curl -sS \
            "https://api.open-meteo.com/v1/forecast?latitude=14.35&longitude=121.06&current=temperature_2m,relative_humidity_2m,precipitation,weather_code,wind_speed_10m")

          echo "Open-Meteo response:"
          echo "$RESPONSE"

          echo
          echo "Weather API request completed successfully."
